<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cântări Tabără 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#5B0EBE;
    --violet-dark:#3B0980;
    --pink:#FF2E93;
    --amber:#FFB627;
    --cyan:#17D7FF;
    --cream:#FFF6EA;
    --ink:#1B0B2E;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{
    min-height:100vh;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,182,39,0.55), transparent 45%),
      radial-gradient(circle at 85% 0%, rgba(23,215,255,0.45), transparent 40%),
      linear-gradient(160deg, var(--violet) 0%, var(--violet-dark) 55%, #24054F 100%);
    padding:28px 16px 60px;
    color:var(--ink);
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
  }
  .eyebrow{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--cream);
    opacity:.75;
    text-align:center;
    margin:0 0 4px;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:34px;
    line-height:1.05;
    color:#fff;
    text-align:center;
    margin:0 0 22px;
    text-shadow:0 3px 0 rgba(0,0,0,0.15);
  }
  h1 span{
    display:block;
    font-size:19px;
    font-weight:500;
    color:var(--amber);
    margin-top:4px;
  }
  .searchbox{
    position:sticky;
    top:12px;
    z-index:5;
    background:var(--cream);
    border-radius:22px;
    padding:6px 6px 6px 20px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 12px 30px rgba(0,0,0,0.35), 0 0 0 3px rgba(255,255,255,0.15);
  }
  .searchbox svg{flex:none;}
  #search{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:18px;
    font-weight:600;
    color:var(--ink);
    padding:14px 0;
  }
  #search::placeholder{color:#9a8fae; font-weight:500;}
  #clearBtn{
    flex:none;
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:var(--violet);
    color:#fff;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
  }
  #clearBtn.show{display:flex;}
  .status{
    text-align:center;
    color:var(--cream);
    font-size:13px;
    font-weight:600;
    opacity:.85;
    margin:14px 0 10px;
  }
  .nowsinging{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--amber);
    color:#4A1B0C;
    border-radius:16px;
    padding:12px 16px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    margin-bottom:14px;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
  }
  .nowsinging.show{display:flex;}
  .nowsinging button{
    border:none;
    background:rgba(0,0,0,0.12);
    color:inherit;
    border-radius:10px;
    padding:6px 10px;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .song{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--cream);
    border-radius:16px;
    padding:12px 14px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 4px 10px rgba(0,0,0,0.18);
    border:3px solid transparent;
  }
  .song:active{transform:scale(0.98);}
  .song.selected{
    border-color:var(--amber);
    box-shadow:0 6px 18px rgba(0,0,0,0.3);
  }
  .badge{
    flex:0 0 38px;
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15px;
    color:#fff;
  }
  .title{
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    line-height:1.3;
    flex:1 1 auto;
    min-width:0;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .actions{
    flex:0 0 auto;
    display:flex;
    gap:10px;
  }
  .actionCol{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  .actionLabel{
    font-size:10px;
    font-weight:600;
    color:#7a6f8c;
    line-height:1;
  }
  .listenBtn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background:var(--violet);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    box-shadow:0 3px 8px rgba(0,0,0,0.25);
  }
  .listenBtn:active{transform:scale(0.92);}
  .lyricsBtn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background:var(--pink);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    box-shadow:0 3px 8px rgba(0,0,0,0.25);
  }
  .lyricsBtn:active{transform:scale(0.92);}
  .pptBtn{
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    background:var(--amber);
    color:#4A1B0C;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    box-shadow:0 3px 8px rgba(0,0,0,0.25);
  }
  .pptBtn:active{transform:scale(0.92);}
  .title mark{
    background:var(--amber);
    color:#4A1B0C;
    border-radius:4px;
    padding:0 2px;
  }
  .empty{
    text-align:center;
    color:var(--cream);
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:17px;
    padding:40px 20px;
    opacity:.9;
  }
  .empty small{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13px;
    margin-top:6px;
    opacity:.75;
  }
  @media (max-width:380px){
    .song{padding:10px;gap:8px;}
    .badge{flex-basis:32px;width:32px;height:32px;font-size:13px;}
    .title{font-size:14px;}
    .actions{gap:6px;}
    .listenBtn,.lyricsBtn,.pptBtn{width:34px;height:34px;}
    .actionLabel{font-size:9px;}
  }
</style>
</head>

<div class="app">

</div>

  "M-a aflat pe cai străine": "https://www.resursecrestine.ro/cantece/197722/m-a-aflat-pe-cai-straine-bunul-meu-pastor-isus",
  "Zidește in mine": "https://www.resursecrestine.ro/cantece/1562/zideste-in-mine"
};

const colors = ["#5B0EBE","#FF2E93","#FFB627","#17D7FF"];
const colorText = ["#fff","#fff","#4A1B0C","#0B3A44"];

function normalize(str){
  return str.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/ă/g,"a").replace(/â/g,"a").replace(/î/g,"i")
    .replace(/ș/g,"s").replace(/ş/g,"s").replace(/ț/g,"t").replace(/ţ/g,"t");
}

const items = songs.map((title, i) => ({ title, num: i+1, norm: normalize(title) }));

const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const statusEl = document.getElementById('status');
const clearBtn = document.getElementById('clearBtn');
const nowSinging = document.getElementById('nowSinging');
const nowSingingText = document.getElementById('nowSingingText');
const nowSingingClear = document.getElementById('nowSingingClear');

let selectedIndex = null;

function highlight(title, query){
  if(!query) return title;
  const norm = normalize(title);
  const idx = norm.indexOf(query);
  if(idx === -1) return title;
  return title.slice(0, idx) + "<mark>" + title.slice(idx, idx+query.length) + "</mark>" + title.slice(idx+query.length);
}

function render(){
  const q = normalize(searchEl.value.trim());
  clearBtn.classList.toggle('show', q.length > 0);

  let results;
  if(!q){
    results = items;
  } else {
    const starts = items.filter(it => it.norm.startsWith(q));
    const contains = items.filter(it => !it.norm.startsWith(q) && it.norm.includes(q));
    results = [...starts, ...contains];
  }

  if(q){
    statusEl.textContent = results.length + (results.length === 1 ? " cântare găsită" : " cântări găsite");
  } else {
    statusEl.textContent = songs.length + " de cântări";
  }

  listEl.innerHTML = "";

  if(results.length === 0){
    const li = document.createElement('li');
    li.className = 'empty';
    li.innerHTML = "Nicio cântare găsită<small>Încearcă alte litere</small>";
    listEl.appendChild(li);
    return;
  }

  results.forEach(it => {
    const li = document.createElement('li');
    li.className = 'song' + (it.num === selectedIndex ? ' selected' : '');
    const c = colors[(it.num-1) % colors.length];
    const ct = colorText[(it.num-1) % colors.length];
    const ytUrl = listenOverrides[it.title] || ("https://www.youtube.com/results?search_query=" + encodeURIComponent(it.title + " cantare crestina"));
    const lyricsUrl = lyricsOverrides[it.title] || ("https://www.google.com/search?q=" + encodeURIComponent("site:resursecrestine.ro " + it.title));
    const pptUrl = pptOverrides[it.title] || null;
    li.innerHTML = `
      <div class="badge" style="background:${c}; color:${ct}">${it.num}</div>
      <div class="title">${highlight(it.title, q)}</div>
      <div class="actions">
        <div class="actionCol">
          <a class="listenBtn" href="${ytUrl}" target="_blank" rel="noopener" aria-label="Ascultă ${it.title}" onclick="event.stopPropagation()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </a>
          <span class="actionLabel">Ascultă</span>
        </div>
        <div class="actionCol">
          <a class="lyricsBtn" href="${lyricsUrl}" target="_blank" rel="noopener" aria-label="Versuri ${it.title}" onclick="event.stopPropagation()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </a>
          <span class="actionLabel">Vezi versurile</span>
        </div>
        ${pptUrl ? `
        <div class="actionCol">
          <a class="pptBtn" href="${pptUrl}" target="_blank" rel="noopener" aria-label="PPT ${it.title}" onclick="event.stopPropagation()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h4a2 2 0 0 1 0 4H8V8z"/><path d="M8 12v5"/></svg>
          </a>
          <span class="actionLabel">PPT</span>
        </div>` : ''}
      </div>
    `;
    li.addEventListener('click', () => {
      selectedIndex = (selectedIndex === it.num) ? null : it.num;
      if(selectedIndex){
        nowSinging.classList.add('show');
        nowSingingText.textContent = it.num + ". " + it.title;
      } else {
        nowSinging.classList.remove('show');
      }
      render();
    });
    listEl.appendChild(li);
  });
}

searchEl.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchEl.value = "";
  searchEl.focus();
  render();
});
nowSingingClear.addEventListener('click', () => {
  selectedIndex = null;
  nowSinging.classList.remove('show');
  render();
});

render();
</script>
</body>
</html>
